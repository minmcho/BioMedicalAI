{{- if .Values.valkey.enabled }}
{{- if .Values.valkey.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "opencare.fullname" . }}-valkey
  labels:
    {{- include "opencare.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: {{ .Values.valkey.persistence.size }} } }
  {{- $sc := .Values.valkey.persistence.storageClass | default .Values.global.storageClass }}
  {{- if $sc }}
  storageClassName: {{ $sc | quote }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opencare.fullname" . }}-valkey
  labels:
    {{- include "opencare.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "opencare.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "opencare.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: valkey
    spec:
      serviceAccountName: {{ include "opencare.serviceAccountName" . }}
      containers:
        - name: valkey
          image: {{ include "opencare.image" (dict "image" .Values.valkey.image "Values" .Values "Chart" .Chart) }}
          imagePullPolicy: {{ .Values.valkey.image.pullPolicy }}
          ports:
            - { name: redis, containerPort: 6379 }
          args: ["--appendonly", "yes"]
          readinessProbe: { tcpSocket: { port: redis }, initialDelaySeconds: 3, periodSeconds: 5 }
          livenessProbe: { tcpSocket: { port: redis }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources:
            {{- toYaml .Values.valkey.resources | nindent 12 }}
          {{- if .Values.valkey.persistence.enabled }}
          volumeMounts:
            - { name: data, mountPath: /data }
          {{- end }}
      {{- if .Values.valkey.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.valkey.persistence.existingClaim | default (printf "%s-valkey" (include "opencare.fullname" .)) }}
      {{- end }}
      {{- with .Values.valkey.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opencare.fullname" . }}-valkey
  labels:
    {{- include "opencare.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "opencare.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: valkey
  ports:
    - { name: redis, port: {{ .Values.valkey.service.port }}, targetPort: redis }
{{- end }}
