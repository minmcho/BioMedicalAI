{{- if .Values.postgresql.enabled }}
{{- if not .Values.postgresql.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "opencare.fullname" . }}-postgresql
  labels:
    {{- include "opencare.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: {{ .Values.postgresql.persistence.size }} } }
  {{- $sc := .Values.postgresql.persistence.storageClass | default .Values.global.storageClass }}
  {{- if $sc }}
  storageClassName: {{ $sc | quote }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "opencare.fullname" . }}-postgresql
  labels:
    {{- include "opencare.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  serviceName: {{ include "opencare.fullname" . }}-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "opencare.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "opencare.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: postgresql
    spec:
      serviceAccountName: {{ include "opencare.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgresql
          image: {{ include "opencare.image" (dict "image" .Values.postgresql.image "Values" .Values "Chart" .Chart) }}
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          ports:
            - { name: postgresql, containerPort: 5432 }
          env:
            - { name: POSTGRES_USER, value: {{ .Values.postgresql.auth.username | quote }} }
            - { name: POSTGRES_DB, value: {{ .Values.postgresql.auth.database | quote }} }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.auth.existingSecret }}
                  key: {{ .Values.postgresql.auth.secretKey }}
          readinessProbe:
            exec: { command: ["pg_isready", "-U", {{ .Values.postgresql.auth.username | quote }}] }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", {{ .Values.postgresql.auth.username | quote }}] }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.postgresql.persistence.existingClaim | default (printf "%s-postgresql" (include "opencare.fullname" .)) }}
      {{- with .Values.postgresql.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgresql.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opencare.fullname" . }}-postgresql
  labels:
    {{- include "opencare.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "opencare.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgresql
  ports:
    - { name: postgresql, port: {{ .Values.postgresql.service.port }}, targetPort: postgresql }
{{- end }}
