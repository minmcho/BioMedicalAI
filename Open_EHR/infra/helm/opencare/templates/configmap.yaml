apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opencare.fullname" . }}-config
  labels:
    {{- include "opencare.labels" . | nindent 4 }}
data:
  AUTH_MODE: {{ .Values.config.authMode | quote }}
  OIDC_JWKS_URL: {{ .Values.config.oidcJwksUrl | quote }}
  OIDC_ISSUER: {{ .Values.config.oidcIssuer | quote }}
  OIDC_AUDIENCE: {{ .Values.config.oidcAudience | quote }}
  ADK_RUNTIME_URL: {{ include "opencare.adkUrl" . | quote }}
  OPENCARE_API_BASE: {{ include "opencare.apiBase" . | quote }}
  AGENT_MODEL: {{ .Values.config.agentModel | quote }}
  DB_HOST: {{ include "opencare.dbHost" . | quote }}
  DB_PORT: {{ .Values.backend.database.port | quote }}
  DB_NAME: {{ .Values.backend.database.name | quote }}
  DB_USER: {{ .Values.backend.database.user | quote }}
