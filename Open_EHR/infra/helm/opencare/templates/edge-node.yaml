{{- if .Values.edgeNode.enabled }}
{{- if not .Values.edgeNode.queue.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "opencare.fullname" . }}-edge-queue
  labels:
    {{- include "opencare.labels" . | nindent 4 }}
    app.kubernetes.io/component: edge-node
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: {{ .Values.edgeNode.queue.size }} } }
  {{- $sc := .Values.edgeNode.queue.storageClass | default .Values.global.storageClass }}
  {{- if $sc }}
  storageClassName: {{ $sc | quote }}
  {{- end }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opencare.fullname" . }}-edge-node
  labels:
    {{- include "opencare.labels" . | nindent 4 }}
    app.kubernetes.io/component: edge-node
spec:
  replicas: {{ .Values.edgeNode.replicaCount }}
  strategy: { type: Recreate }
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "opencare.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: edge-node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "opencare.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: edge-node
    spec:
      serviceAccountName: {{ include "opencare.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.edgeNode.podSecurityContext | nindent 8 }}
      containers:
        - name: edge-node
          image: {{ include "opencare.image" (dict "image" .Values.edgeNode.image "Values" .Values "Chart" .Chart) }}
          imagePullPolicy: {{ .Values.edgeNode.image.pullPolicy }}
          command: ["edge-node"]
          ports:
            - { name: http, containerPort: 8082 }
          env:
            - { name: EDGE_ADDR, value: ":8082" }
            - { name: EDGE_QUEUE_DIR, value: "/data/queue" }
            - name: CORE_URL
              value: {{ .Values.edgeNode.coreUrl | default (include "opencare.apiBase" .) | quote }}
            - name: OPENCARE_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.edgeNode.gatewayTokenSecret.name }}
                  key: {{ .Values.edgeNode.gatewayTokenSecret.key }}
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 3, periodSeconds: 5 }
          resources:
            {{- toYaml .Values.edgeNode.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.edgeNode.securityContext | nindent 12 }}
          volumeMounts:
            - { name: queue, mountPath: /data/queue }
      volumes:
        - name: queue
          persistentVolumeClaim:
            claimName: {{ .Values.edgeNode.queue.existingClaim | default (printf "%s-edge-queue" (include "opencare.fullname" .)) }}
      {{- with .Values.edgeNode.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opencare.fullname" . }}-edge-node
  labels:
    {{- include "opencare.labels" . | nindent 4 }}
    app.kubernetes.io/component: edge-node
spec:
  type: {{ .Values.edgeNode.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "opencare.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: edge-node
  ports:
    - { name: http, port: {{ .Values.edgeNode.service.port }}, targetPort: http }
{{- end }}
