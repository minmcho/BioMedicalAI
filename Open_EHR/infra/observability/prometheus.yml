# Prometheus — Phase 17 (BD-61) config as code.
# The live stack runs this file (paths were made portable at the
# Phase 17 gate: rule_files resolves relative to this config file;
# the MinIO bearer-token file is expected NEXT TO this config as
# ./prometheus-token.txt — in the live-stack drill it was generated
# by `mc admin prometheus generate` into the live-stack MinIO dir
# (0600, outside the repo) and copied next to the running config).
# Scrape targets are the local stack's own services on loopback.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alert-rules.yml

scrape_configs:
  - job_name: opencare-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8000"]
        labels: { service: opencare-ehr, tier: core }
  - job_name: opencare-adk
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8100"]
        labels: { service: opencare-adk, tier: agents }
  - job_name: opencare-go-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8081"]
        labels: { service: mllp-gateway, tier: go }
  - job_name: opencare-go-edge
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8082"]
        labels: { service: edge-node, tier: go }
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    # MinIO metrics require its prometheus bearer token (generated by
    # `mc admin prometheus generate`); the token file is a local
    # live-stack secret (0600, outside the repo) — never committed.
    bearer_token_file: prometheus-token.txt
    static_configs:
      - targets: ["127.0.0.1:9000"]
        labels: { service: minio, tier: storage }
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
  - job_name: otelcol
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8888"]
        labels: { service: otelcol, tier: observability }
