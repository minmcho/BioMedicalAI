server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Same-origin API: the built app calls relative paths (API_BASE
    # defaults to ""), and nginx forwards the API prefixes to the backend
    # service. No cross-origin browser calls in this deployment either.
    # (If VITE_API_BASE was baked in at build time instead, these
    # locations are simply unused.)
    location ~ ^/(health|fhir|portal|studio|lab|pophealth|warehouse|billing|pharmacy|ed|radiology|dicomweb|surgery|orders|notes|flowsheets|inpatient|access|interop)(/|$) {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $content_type;
    }
}
