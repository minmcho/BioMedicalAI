# OpenCare — nginx TLS template (Phase 10, Track K).
#
# Deployment note: this file is a TEMPLATE, not the dev config. The dev /
# docker-compose deployment keeps using nginx.conf (plain HTTP on :8080,
# unchanged). To serve OpenCare over HTTPS:
#
#   1. Obtain a certificate for your hostname (e.g. with certbot /
#      Let's Encrypt, or your hospital CA) and place the files at the
#      paths below (or edit the paths): /etc/nginx/tls/fullchain.pem and
#      /etc/nginx/tls/privkey.pem. NEVER commit private keys to the repo.
#   2. Mount this file as the nginx server config INSTEAD of nginx.conf
#      and mount the certificate directory read-only.
#   3. The :80 server below only redirects to HTTPS; the API proxy list
#      is identical to nginx.conf (same prefixes, incl. the Phase 9
#      /messages, /engagement, /quality groups and the Phase 10
#      /agents, /rules, /compliance, /privacy groups).
#   4. HSTS is set on the TLS server. Only enable HSTS once the HTTPS
#      deployment is permanent — browsers pin it.
#
# TLS terminates here; the backend stays on the private network. TLS 1.2+
# only, with a modern cipher set (Mozilla intermediate profile).

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/(health|fhir|portal|studio|lab|pophealth|warehouse|billing|pharmacy|ed|radiology|dicomweb|surgery|orders|notes|flowsheets|inpatient|access|interop|messages|engagement|quality|agents|rules|compliance|privacy|continuum|people|reports|devices|pipelines|accounts|registration|protocols|tiering|report-engine|indicators|dbplatform|ai-providers|studio-ops|indicators|home)(/|$) {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $content_type;
        proxy_set_header X-Forwarded-Proto https;
    }
}
