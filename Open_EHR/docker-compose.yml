services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openehr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openehr}
      POSTGRES_DB: ${POSTGRES_DB:-openehr}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openehr}"]
      interval: 5s
      timeout: 3s
      retries: 10
  valkey:
    image: valkey/valkey:8
    ports:
      - "6379:6379"
    volumes:
      - valkeydata:/data
  app:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-openehr}:${POSTGRES_PASSWORD:-openehr}@db:5432/${POSTGRES_DB:-openehr}
      VALKEY_URL: redis://valkey:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_started
  mllp:
    # Phase 8 HL7 v2 listener (app.mllp_server): real MLLP over TCP.
    # Inbound ORU lands as lab drafts via the shared ingest path;
    # inbound ADT is recorded as external events only.
    build:
      context: ./backend
    command: ["python", "-m", "app.mllp_server", "--host", "0.0.0.0", "--port", "2575"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-openehr}:${POSTGRES_PASSWORD:-openehr}@db:5432/${POSTGRES_DB:-openehr}
    ports:
      - "2575:2575"
    depends_on:
      db:
        condition: service_healthy
  mllp-gateway:
    # Platform pass: Go MLLP gateway (services/go). Receives HL7 v2
    # over MLLP and forwards payloads into the core's EXISTING
    # offline-batch raw-zone contract (POST /devices/offline/batches);
    # spools durably on disk and drains in order when the core is
    # unreachable — never drops silently. The Python mllp service
    # above remains the in-core listener; this is the edge/gateway
    # tier (host port 2576 so the two never clash). Requires
    # OPENCARE_GATEWAY_TOKEN (a devices.manage-capable token) and the
    # published integration/offline config enabled in Studio.
    build:
      context: ./services/go
    command: ["mllp-gateway"]
    environment:
      MLLP_ADDR: ":2575"
      GATEWAY_HEALTH_ADDR: ":8081"
      GATEWAY_SPOOL_DIR: /data/spool
      CORE_URL: http://app:8000
      OPENCARE_GATEWAY_TOKEN: ${OPENCARE_GATEWAY_TOKEN:-}
    ports:
      - "2576:2575"
      - "8081:8081"
    volumes:
      - gatewayspool:/data/spool
    depends_on:
      app:
        condition: service_started
  edge-node:
    # Platform pass: Go store-and-forward edge node (services/go).
    # Belongs at a clinic/site edge, NOT in the central stack — hence
    # the compose profile. On the edge host run:
    #   EDGE_CORE_URL=https://core.example.org \
    #     docker compose --profile edge up -d edge-node
    # Captures payloads over HTTP while the WAN/core is down and
    # syncs them in receive order when it returns (at-least-once).
    profiles: ["edge"]
    build:
      context: ./services/go
    command: ["edge-node"]
    environment:
      EDGE_ADDR: ":8082"
      EDGE_QUEUE_DIR: /data/queue
      CORE_URL: ${EDGE_CORE_URL:-http://app:8000}
      OPENCARE_GATEWAY_TOKEN: ${OPENCARE_GATEWAY_TOKEN:-}
    ports:
      - "8082:8082"
    volumes:
      - edgequeue:/data/queue
  web:
    build:
      context: ./web
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
        VITE_AUTH_MODE: ${VITE_AUTH_MODE:-dev}
    ports:
      - "8080:8080"
    depends_on:
      app:
        condition: service_started
volumes:
  pgdata:
  valkeydata:
  gatewayspool:
  edgequeue:
